[project]
name = "memorypilot"
version = "0.1.0"
description = "具备可追溯记忆和上下文预算的多会话 Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1.2.17,<1.3",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
  "langchain-deepseek==1.1.1",
  "langmem==0.0.30",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.2,<2",
  "fastapi>=0.162,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=3.2,<4", "psycopg[binary,pool]>=3.3,<4"]
embeddings = ["sentence-transformers>=6.2,<7"]

[project.scripts]
memorypilot = "memorypilot.cli:entrypoint"

[dependency-groups]
dev = ["pytest>=9.1,<10", "httpx>=0.28,<1", "ruff>=0.16,<1"]

[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
